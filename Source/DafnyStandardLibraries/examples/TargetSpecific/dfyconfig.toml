# The Makefile has its own non-trivial logic for determining which files
# to include in which mode.
includes = [
  "../Helpers.dfy"
]

[options]
standard-libraries = true
enforce-determinism = true
reads-clauses-on-methods = true
type-system-refresh = true
general-traits = "datatype"
general-newtypes = true


# TestStatistics.Test_Median_Odd_Case_Sorted_Sequence exceeds 1e6 since #6431
# strengthened the arrow-type frame axiom premises; 86 verified / 0 errors before,
# 85 / 1 out of resource after.
resource-limit = 3000000
# These give too many false positives right now, but should be enabled in the future
warn-redundant-assumptions = false
warn-contradictory-assumptions = true
