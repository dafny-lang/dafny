# An invalid workflow file fails as `startup_failure`: no jobs, no logs, easy to miss.
# actionlint catches that statically, in the PR that introduces it.

name: Lint workflows

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Dafny
        uses: actions/checkout@v7

      - name: Lint workflows
        # actionlint ships no first-party action, so this uses its published container image.
        # The image bundles shellcheck, so `run:` blocks are checked too, with no suppressions.
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
