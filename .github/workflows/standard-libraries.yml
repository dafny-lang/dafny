name: Build and Test Dafny Standard Libraries

on:
  workflow_dispatch:
  pull_request:
    branches: [ master, main-* ]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-deep-tests:
     uses: ./.github/workflows/check-deep-tests-reusable.yml

  build:
    needs: check-deep-tests
    if: always() && (( github.event_name == 'pull_request' && (needs.check-deep-tests.result == 'success' || contains(github.event.pull_request.labels.*.name, 'run-deep-tests'))) || ( github.event_name == 'push' && ( github.ref_name == 'master' || vars.TEST_ON_FORK == 'true' )))
    runs-on: macos-14

    steps:
      - name: Checkout Dafny
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up JDK 18
        uses: actions/setup-java@v6
        with:
          java-version: 18
          distribution: corretto
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false
      - name: Set up goimports
        # setup-go exports GOTOOLCHAIN=local job-wide, which stops the steps that call
        # go directly from silently upgrading past the version pinned above -- but it
        # also blocks this install, because x/tools tracks the current Go release, so
        # goimports@latest regularly needs a newer Go than the one under test. Allow a
        # toolchain switch for this step alone: goimports is only a formatter the Go
        # backend shells out to, so the Go that builds it is not part of that surface.
        env:
          GO111MODULE: on
          GOTOOLCHAIN: auto
        run: go install golang.org/x/tools/cmd/goimports@latest
      - name: Build Dafny
        run: dotnet build Source/Dafny.sln
      - name: Get Z3
        run: make z3-mac
      - run: npm install bignumber.js
      - name: Test DafnyStandardLibraries
        run: make -C Source/DafnyStandardLibraries all
      
